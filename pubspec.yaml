name: check_ronda
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.20.3
  mobile_scanner: ^6.0.3
  geolocator: ^13.0.2
  pdf: ^3.11.1
  printing: ^5.13.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1

  # --- ADICIONE ESTAS DUAS LINHAS DO FIREBASE ---
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.1
  firebase_auth: ^5.4.1
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^18.0.1
  timezone: any
  cloud_functions: ^5.6.2
  http: ^1.6.0
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icone/icone.png"
  image_path_ios: "assets/icone/icone_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#2450E6"
  adaptive_icon_foreground: "assets/icone/icone_frente.png"