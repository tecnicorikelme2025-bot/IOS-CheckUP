name: Build iOS IPA (Sem Assinatura)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Baixar dependências
        run: flutter pub get

      - name: Ajustar versão mínima do iOS para 15.5
        run: |
          cd ios
          if grep -q "platform :ios" Podfile; then
            sed -i '' "s/^#\s*platform :ios.*/platform :ios, '15.5'/g" Podfile
            sed -i '' "s/^platform :ios.*/platform :ios, '15.5'/g" Podfile
          else
            sed -i '' "1s/^/platform :ios, '15.5'\n/" Podfile
          fi

      - name: Compilar app iOS sem assinatura
        run: flutter build ios --release --no-codesign

      - name: Empacotar em .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-sem-assinatura.ipa Payload

      - name: Disponibilizar .ipa para download
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-ios
          path: app-sem-assinatura.ipa
