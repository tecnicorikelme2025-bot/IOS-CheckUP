name: Build iOS IPA (Sem Assinatura)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Baixar dependências
        run: flutter pub get

      - name: Gerar arquivos iOS e definir versão mínima 15.5
        run: |
          flutter precache --ios
          cd ios
          if [ ! -f Podfile ]; then
            pod init
          fi
          if grep -q "platform :ios" Podfile; then
            sed -i '' "s/.*platform :ios.*/platform :ios, '15.5'/g" Podfile
          else
            sed -i '' "1s/^/platform :ios, '15.5'\n/" Podfile
          fi
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' Runner.xcodeproj/project.pbxproj

      - name: Compilar app iOS sem assinatura
        run: flutter build ios --release --no-codesign

      - name: Empacotar em .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-sem-assinatura.ipa Payload

      - name: Disponibilizar .ipa para download
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-ios
          path: app-sem-assinatura.ipa
